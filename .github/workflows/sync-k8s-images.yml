name: Sync K8s & Rook-Ceph Images to Aliyun ACR

on:
  workflow_dispatch:
    inputs:
      aliyun_registry:
        description: '阿里云 ACR 专属域名'
        required: true
        default: 'crpi-152y3mtli6krf23o.cn-hangzhou.personal.cr.aliyuncs.com'
      aliyun_namespace:
        description: '阿里云 ACR 命名空间 (Namespace 名称)'
        required: true
        default: 'my-k8s-rook'
      extra_images:
        description: '额外需要同步的镜像 (多个以空格或换行分隔，选填)'
        required: false
        default: ''

jobs:
  sync-images:
    name: Pull Overseas Images & Push to Aliyun ACR
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ github.event.inputs.aliyun_registry }}
          username: ${{ secrets.ALIYUN_REGISTRY_USER }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Sync Images
        run: |
          set -e
          REGISTRY="${{ github.event.inputs.aliyun_registry }}"
          NAMESPACE="${{ github.event.inputs.aliyun_namespace }}"
          TARGET_PREFIX="${REGISTRY}/${NAMESPACE}"

          # 预设的 NVIDIA GPU / Network Operator 及相关镜像清单
          DEFAULT_IMAGES=(
            "nvcr.io/nvidia/gpu-operator:v26.7.1"
            "nvcr.io/nvidia/k8s/container-toolkit:v1.20.1"
            "nvcr.io/nvidia/k8s-device-plugin:v0.20.1"
            "nvcr.io/nvidia/k8s/dcgm-exporter:4.6.1-4.8.4-distroless"
            "nvcr.io/nvidia/cloud-native/k8s-mig-manager:v0.15.1"
            "nvcr.io/nvidia/cloud-native/k8s-driver-manager:v0.12.1"
            "registry.k8s.io/nfd/node-feature-discovery:v0.19.0"
            "nvcr.io/nvidia/cloud-native/network-operator:v26.7.0"
            "nvcr.io/nvidia/mellanox/network-operator-init-container:network-operator-v26.7.0"
            "nvcr.io/nvidia/mellanox/node-feature-discovery:network-operator-v26.7.0"
            "nvcr.io/nvidia/mellanox/k8s-rdma-shared-dev-plugin:network-operator-v26.7.0"
            "nvcr.io/nvidia/mellanox/multus-cni:network-operator-v26.7.0"
            "nvcr.io/nvidia/mellanox/plugins:network-operator-v26.7.0"
            "nvcr.io/nvidia/mellanox/nic-feature-discovery:network-operator-v26.7.0"
          )

          # 合并用户额外输入的镜像
          ALL_IMAGES=("${DEFAULT_IMAGES[@]}")
          if [ -n "${{ github.event.inputs.extra_images }}" ]; then
            for img in ${{ github.event.inputs.extra_images }}; do
              ALL_IMAGES+=("$img")
            done
          fi

          echo "=================================================="
          echo "目标仓库前缀: ${TARGET_PREFIX}"
          echo "即将同步 ${#ALL_IMAGES[@]} 个镜像..."
          echo "=================================================="

          for src in "${ALL_IMAGES[@]}"; do
            echo ">>> [1/3] 海外直接拉取: ${src}"
            docker pull "${src}"

            # 提取最后一段 "镜像名:标签"（因为阿里云个人版不支持多级斜杠路径）
            # 例如: registry.k8s.io/sig-storage/csi-provisioner:v4.0.1 -> csi-provisioner:v4.0.1
            IMAGE_NAME_TAG=$(echo "${src}" | awk -F'/' '{print $NF}')
            target="${TARGET_PREFIX}/${IMAGE_NAME_TAG}"

            echo ">>> [2/3] 重新标记为: ${target}"
            docker tag "${src}" "${target}"

            echo ">>> [3/3] 推送到阿里云 ACR: ${target}"
            docker push "${target}"

            # 清理本地临时镜像
            docker rmi "${src}" "${target}" || true
            echo "--- 完成: ${IMAGE_NAME_TAG} ---"
          done

          echo "=================================================="
          echo "🎉 全部镜像转存完成！"
          echo "=================================================="
